# Sellora AI — hardened HTTPS server block (use after you have a certificate).
#
# 1. Get a certificate:   sudo certbot certonly --nginx -d your-domain.com
# 2. Copy this file over /etc/nginx/sites-available/sellora, replace "your-domain.com",
#    and keep the "location" blocks of sellora.conf (they are repeated below).
# 3. sudo nginx -t && sudo systemctl reload nginx
# 4. Set COOKIE_SECURE=true and TRUST_PROXY=true in .env, set APP_URL/API_URL/CORS_ORIGINS to https://…, then restart.
#
# Only modern TLS is allowed. Plain HTTP only redirects.

upstream sellora_web { server 127.0.0.1:3000; keepalive 32; }
upstream sellora_api { server 127.0.0.1:4000; keepalive 32; }

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

limit_req_zone $binary_remote_addr zone=sellora_api_zone:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=sellora_auth_zone:10m rate=10r/m;

server {
  listen 80;
  listen [::]:80;
  server_name your-domain.com;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name your-domain.com;

  ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;

  server_tokens off;
  client_max_body_size 12m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 30s;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  access_log /var/log/nginx/sellora.access.log;
  error_log  /var/log/nginx/sellora.error.log warn;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;

  # Sign-in, sign-up and password reset: slow down password guessing before it reaches the app.
  location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password|login/2fa)$ {
    limit_req zone=sellora_auth_zone burst=10 nodelay;
    proxy_set_header Connection "";
    proxy_pass http://sellora_api;
  }

  location /api/ {
    limit_req zone=sellora_api_zone burst=60 nodelay;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_pass http://sellora_api;
  }

  # Webhooks from WhatsApp, Meta and payment gateways must never be rate limited by Nginx.
  location /api/v1/webhooks/ {
    proxy_set_header Connection "";
    proxy_pass http://sellora_api;
  }
  location /api/v1/payment-gateways/ {
    proxy_set_header Connection "";
    proxy_pass http://sellora_api;
  }

  location /socket.io/ {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://sellora_api;
  }

  location /health {
    proxy_set_header Connection "";
    proxy_pass http://sellora_api;
  }

  location /_next/static/ {
    proxy_pass http://sellora_web;
    proxy_set_header Connection "";
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Never serve hidden files (.env, .git) even if one ends up under a served path.
  location ~ /\.(?!well-known) { deny all; }

  location / {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://sellora_web;
  }
}
