# Sellora AI — Nginx reverse proxy (no Docker)
#
# Internet → Nginx :80/:443
#   /            → Next.js web      127.0.0.1:3000
#   /api/        → NestJS API       127.0.0.1:4000
#   /socket.io/  → Realtime (API)   127.0.0.1:4000 (WebSocket)
#   /health      → API health checks
#
# Install:   sudo cp sellora.conf /etc/nginx/sites-available/sellora
#            sudo ln -s /etc/nginx/sites-available/sellora /etc/nginx/sites-enabled/sellora
#            sudo nginx -t && sudo systemctl reload nginx
# HTTPS:     sudo certbot --nginx -d your-domain.com   (then set COOKIE_SECURE=true)
#
# Replace "your-domain.com" (or use the server IP, e.g. 192.168.197.100, for LAN tests).

upstream sellora_web { server 127.0.0.1:3000; keepalive 32; }
upstream sellora_api { server 127.0.0.1:4000; keepalive 32; }

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

limit_req_zone $binary_remote_addr zone=sellora_api_zone:10m rate=30r/s;

server {
  listen 80;
  listen [::]:80;
  server_name your-domain.com;

  # Uploads (product images, knowledge documents): keep in sync with MAX_UPLOAD_MB
  client_max_body_size 12m;

  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Enable after HTTPS works:
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  access_log /var/log/nginx/sellora.access.log;
  error_log  /var/log/nginx/sellora.error.log warn;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;

  location /api/ {
    limit_req zone=sellora_api_zone burst=60 nodelay;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_pass http://sellora_api;
  }

  # Meta webhooks must never be rate limited by Nginx
  location /api/v1/webhooks/ {
    proxy_set_header Connection "";
    proxy_pass http://sellora_api;
  }

  location /socket.io/ {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://sellora_api;
  }

  location /health {
    proxy_set_header Connection "";
    proxy_pass http://sellora_api;
  }

  location /_next/static/ {
    proxy_pass http://sellora_web;
    proxy_set_header Connection "";
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://sellora_web;
  }
}
