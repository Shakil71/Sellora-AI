# =============================================================================
# Sellora AI — Apache httpd reverse proxy (RHEL / Oracle Linux / Rocky / Alma).
# Use this instead of deploy/nginx/sellora.conf when Apache already owns the
# web ports. Requires mod_proxy, mod_proxy_http, mod_proxy_wstunnel,
# mod_rewrite and mod_headers (all enabled by default on these systems).
#
#   cp sellora.conf /etc/httpd/conf.d/sellora.conf
#   replace the placeholders, then: apachectl configtest && systemctl reload httpd
#
# Placeholders: __LISTEN__ (public port), __SERVER_NAME__, __API_PORT__ and
# __WEB_PORT__ (API_PORT / WEB_PORT from .env).
# =============================================================================
Listen __LISTEN__

<VirtualHost *:__LISTEN__>
    ServerName __SERVER_NAME__

    LimitRequestBody 26214400
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 120
    RequestHeader set X-Forwarded-Proto "http"

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    # Realtime (Socket.IO) — WebSocket upgrade first, then long-polling fallback.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/socket.io/(.*) ws://127.0.0.1:__API_PORT__/socket.io/$1 [P,L]
    ProxyPass        /socket.io/ http://127.0.0.1:__API_PORT__/socket.io/
    ProxyPassReverse /socket.io/ http://127.0.0.1:__API_PORT__/socket.io/

    # API, webhooks and health checks.
    ProxyPass        /api/    http://127.0.0.1:__API_PORT__/api/
    ProxyPassReverse /api/    http://127.0.0.1:__API_PORT__/api/
    ProxyPass        /health  http://127.0.0.1:__API_PORT__/health
    ProxyPassReverse /health  http://127.0.0.1:__API_PORT__/health

    # Everything else is the Next.js web app.
    ProxyPass        /        http://127.0.0.1:__WEB_PORT__/
    ProxyPassReverse /        http://127.0.0.1:__WEB_PORT__/

    ErrorLog  logs/sellora_error.log
    CustomLog logs/sellora_access.log combined
</VirtualHost>
